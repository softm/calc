<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>calc · 화면 크기 확인</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e8eee8;color:#19372a;font:14px system-ui,sans-serif}
  header{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px;flex-wrap:wrap}h1{font-size:16px;margin:0 15px 0 0}
  label{display:flex;align-items:center;gap:7px}select{padding:8px;border:1px solid #becfc0;border-radius:8px;background:white;color:inherit}
  main{display:flex;justify-content:center;padding:0 16px 24px;overflow:auto}iframe{display:block;border:1px solid #bccdbc;box-shadow:0 8px 35px #243d261f;border-radius:12px;flex-shrink:0;background:#f5f6f2}
</style>
<header><h1>calc · 화면 크기 확인</h1><label>너비<select id="width"><option>320</option><option>360</option><option selected>390</option><option>768</option><option>1140</option></select></label><label>높이<select id="height"><option>800</option><option selected>844</option><option>1024</option></select></label></header>
<main><iframe id="preview" src="../index.html" title="calc 반응형 화면" width="390" height="844"></iframe></main>
<script>
  const frame=document.getElementById('preview');
  for(const dimension of ['width','height'])document.getElementById(dimension).addEventListener('change',event=>frame.setAttribute(dimension,event.target.value));
</script>
</html>
